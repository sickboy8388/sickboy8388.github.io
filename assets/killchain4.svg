<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 760" style="background-color:#17151c" role="graphics-document document" aria-roledescription="flowchart">
<style>
  text{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;fill:#f2ede6}
  .node{rx:6;ry:6;stroke-width:1.5}
  .edge{stroke:#8f8797;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
  .cluster{fill:none;stroke:#2c2833;stroke-width:1.5;stroke-dasharray:6,4;rx:10;ry:10}
  .cluster-label{font-size:13px;fill:#ff6b3d;font-weight:700;letter-spacing:1px}
  .node-label{font-size:13px;text-anchor:middle;dominant-baseline:central}
  .sub-label{font-size:11px;fill:#a49caa;text-anchor:middle;dominant-baseline:central}
  .dead{opacity:0.45}
  .dead-line{stroke:#ff5d5d;stroke-width:2;stroke-dasharray:none}
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,3.5 L0,7z" fill="#8f8797"/></marker>
